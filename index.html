<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142811">
<title>Bonsai Bola – Pasaran Bola Hari Ini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'] },
  colors: { bg: '#142811', card: '#0a1408', card2: '#183215', line: '#1f3d1b', lime: '#4ade80', mute: '#9ca3af',
    /* tema terang (area di bawah header) */
    page: '#e6f5da', lcard: '#eef9e6', lhead: '#d3ebc2', lline: '#b9c9ad', ink: '#1f2d1a', lmute: '#5f6f55',
    nblue: '#0000cd', nred: '#e0262e', oblue: '#1c6ef2' }
}}};
</script>
<style>
  body { background:#e6f5da; color:#1f2d1a; font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif; }
  body.lock { overflow:hidden; }
  #side.open { transform:translateX(0); }
  #ovl.open { opacity:1; pointer-events:auto; }
  .tnum { font-variant-numeric: tabular-nums; }
  .no-sb { scrollbar-width:none; } .no-sb::-webkit-scrollbar { display:none; }
  .match { cursor:pointer; transition: background .15s; }
  .match:hover { background:#e1f3d4; }
  :focus-visible { outline:2px solid #4ade80; outline-offset:2px; }
  .dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .logo { width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .ini { width:22px; height:22px; flex-shrink:0; border-radius:9999px; background:#d3ebc2; color:#1f2d1a; font-size:9px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  @media (max-width:380px){ .tabbtn{ font-size:12px; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
</head>
<body class="min-h-screen">

<!-- 1. TOPBAR: burger + logo + jam -->
<header id="top" class="sticky top-0 z-30 bg-card border-b border-line text-white">
  <div class="max-w-5xl mx-auto px-3 h-14 flex items-center gap-3">
    <button id="burger" aria-label="Buka menu" aria-controls="side" aria-expanded="false"
      class="shrink-0 grid place-items-center h-10 w-10 rounded-lg border border-line bg-card2 hover:border-lime">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="min-w-0 flex items-center">
      <img src="https://bonsaibola5.org/Images/logo.png" alt="Bonsai Bola" decoding="async"
        class="h-8 w-auto max-w-[160px] object-contain sm:h-10 sm:max-w-[220px]"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'text-xl font-extrabold tracking-tight text-lime',textContent:'BONSAI BOLA'}))">
    </h1>
    <span class="ml-auto shrink-0 inline-flex items-center gap-2 rounded-full border border-line bg-card2 px-3 py-1 text-xs tnum">
      <span class="text-mute">WIB</span><span id="clock" class="font-semibold">--:--:--</span>
    </span>
  </div>
</header>

<!-- 2. KOLOM PENCARIAN -->
<div class="bg-bg border-b border-line">
  <div class="max-w-5xl mx-auto px-3 py-2.5">
    <label class="block">
      <span class="sr-only">Cari tim atau liga</span>
      <input id="q" type="search" placeholder="Cari tim atau liga" autocomplete="off"
        class="w-full rounded-lg border border-line bg-card px-3 py-2.5 text-sm text-white placeholder:text-mute focus:border-lime focus:outline-none">
    </label>
  </div>
</div>

<!-- 3. BANNER -->
<div class="max-w-5xl mx-auto px-3 pt-3">
  <img id="hero" src="https://mobile.bonsaibolamen.com/apps/img/165/slider/bonsai1.png" alt="Bonsai Bola"
    class="w-full h-28 sm:h-44 object-cover rounded-xl border border-lline" decoding="async"
    onerror="this.remove()">
</div>

<!-- SIDEBAR KIRI (muncul dari tombol burger) -->
<div id="ovl" class="fixed inset-0 z-40 bg-black/50 opacity-0 pointer-events-none transition-opacity"></div>
<aside id="side" aria-label="Menu" class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] -translate-x-full transition-transform bg-bg text-white border-r border-line flex flex-col">
  <div class="h-14 px-4 flex items-center justify-between border-b border-line shrink-0">
    <span class="font-extrabold tracking-tight text-lime">MENU</span>
    <button id="sclose" aria-label="Tutup menu" class="grid place-items-center h-9 w-9 rounded-lg border border-line hover:border-lime">✕</button>
  </div>
  <div class="flex-1 overflow-y-auto p-4 space-y-5">
    <section>
      <h2 class="mb-2 text-[11px] font-bold uppercase tracking-wider text-mute">Jadwal</h2>
      <div id="days" class="flex flex-col gap-1.5" role="tablist" aria-label="Pilih tanggal"></div>
      <div id="hdays" class="hidden mt-2 grid grid-cols-3 gap-1.5" aria-label="Pilih tanggal riwayat"></div>
    </section>
    <section>
      <h2 class="mb-2 text-[11px] font-bold uppercase tracking-wider text-mute">Liga</h2>
      <div id="leagues" class="flex flex-col gap-1.5" aria-label="Pilih liga"></div>
    </section>
  </div>
</aside>

<main class="max-w-5xl mx-auto px-3 py-4">
  <div class="mb-2 flex items-center justify-between gap-2">
    <button id="curbtn" class="min-w-0 inline-flex items-center gap-2 rounded-full bg-ink text-white px-3.5 py-1.5 text-sm font-semibold">
      <span id="cur" class="truncate">Hari Ini</span><span class="text-lime text-xs shrink-0">▾ ubah</span></button>
  </div>
  <div class="mb-3 flex items-center justify-between gap-2 text-xs text-lmute">
    <span id="upd">Memuat…</span>
    <button id="reload" class="shrink-0 rounded-full border border-lline bg-lcard px-3 py-1 font-semibold text-ink hover:bg-lhead">↻ Perbarui</button>
  </div>
  <div id="banner" class="hidden mb-3 rounded-lg border border-lline bg-lhead px-3 py-2 text-xs text-ink"></div>
  <div id="list" class="space-y-4" aria-live="polite"></div>
  <p class="mt-8 text-center text-xs text-lmute">Odds hanya sebagai informasi. Data diperbarui otomatis setiap 10 menit. Ketuk pertandingan untuk menyalin pasaran.</p>
</main>

<div id="toast" class="fixed left-1/2 bottom-6 z-30 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none transition rounded-full bg-lime px-4 py-2 text-sm font-semibold text-card shadow-lg max-w-[90vw] truncate" role="status"></div>

<script>
/* ================= KONFIGURASI ================= */
const TZ = 'Asia/Jakarta';
// Pill filter. Data liga (nama, negara, grup) datang dari server: api/odds.js
const FILTERS = ['Semua Liga', 'Premier League', 'La Liga', 'Serie A', 'Bundesliga', 'Liga Asia', 'Champions League'];
const DAY_LABELS = ['Hari Ini', 'Besok', 'Lusa'];
const TABS = ['live', 0, 1, 2, 'hist'];   // Live, Hari Ini, Besok, Lusa, Riwayat
const HIST_DAYS = [-1, -2, -3];           // Riwayat hanya 3 hari terakhir
const REFRESH_MS = 10 * 60 * 1000;        // update data setiap 10 menit

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr = off => new Date(Date.now() + off * 864e5).toLocaleDateString('en-CA', { timeZone: TZ });
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDate = off => new Date(Date.now() + off * 864e5).toLocaleDateString('id-ID', { timeZone: TZ, day: 'numeric', month: 'short' });
const fmtHdp = (v, gives) => (v === 0 ? '0' : (gives ? '-' : '+') + v);

const state = { tab: 0, hday: -1, all: [], updatedAt: 0, day: 0, league: 'Semua Liga', q: '', data: {}, demo: false, notice: '', error: '', req: null };

/* ================= DATA LAYER ================= */
// Semua data diambil dari endpoint internal. API key hanya ada di server (api/odds.js).
async function fetchData() {
  const res = await fetch('/api/odds', { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  if (!(res.headers.get('content-type') || '').includes('json'))
    throw new Error('/api/odds tidak berjalan sebagai Serverless Function. Pastikan folder api/ ada di root proyek');
  return res.json();
}

const dayOf = ts => new Date(ts).toLocaleDateString('en-CA', { timeZone: TZ });

// Ambil data dari server. silent=true -> tanpa tampilan "Memuat" (dipakai auto-update 10 menit)
async function loadData(force) {
  if (state.all.length && !force) return;
  try {
    const p = await fetchData();
    state.all = p.events || [];
    state.demo = p.source === 'mock';
    state.notice = p.notice || '';
    state.error = '';
    state.updatedAt = Date.now();
  } catch (e) {
    if (!state.all.length) state.error = 'Tidak bisa memuat data dari server (' + e.message + ').';
    else state.notice = 'Gagal memperbarui data, menampilkan data terakhir.';
  }
}
/* ================= STATUS ================= */
function status(m) {
  if (m.st) return m.st;
  const diff = (Date.now() - m.ts) / 6e4;
  if (diff >= 0 && diff <= 115) return { s: 'live', min: Math.min(90, Math.max(1, Math.round(diff))) };
  if (diff > 115) return { s: 'ft' };
  return { s: 'up' };
}
function statusHtml(m) {
  const s = status(m);
  if (s.s === 'live') {
    const lbl = s.detail === 'HT' ? 'HT' : 'Live' + (s.min ? ' ' + s.min + "'" : '');
    return `<span class="inline-flex items-center gap-1 rounded bg-nred/10 px-1.5 py-0.5 text-[11px] font-bold text-nred"><span class="dot h-1.5 w-1.5 rounded-full bg-nred"></span>${lbl}</span>`;
  }
  if (s.s === 'ft') return `<span class="inline-block rounded bg-ink/10 px-1.5 py-0.5 text-[11px] font-bold text-ink">${esc(s.detail && s.detail !== 'FT' ? s.detail : 'FT')}</span>`;
  return `<span class="text-[11px] text-lmute">Upcoming</span>`;
}

/* ================= RENDER ================= */
const pill = on => on ? 'bg-lime border-lime text-card' : 'bg-card border-line text-white hover:border-lime/60';
const subCls = on => on ? 'text-card/70' : 'text-mute';
const hDate = off => new Date(Date.now() + off * 864e5).toLocaleDateString('id-ID', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
function liveCount() { return state.all.filter(m => status(m).s === 'live').length; }

function renderFilters() {
  $('#days').innerHTML = TABS.map(t => {
    const on = state.tab === t;
    let label, sub;
    if (t === 'live') { label = '<span class="inline-flex items-center gap-1"><span class="dot h-1.5 w-1.5 rounded-full bg-nred"></span>Live</span>'; sub = liveCount() + ' laga'; }
    else if (t === 'hist') { label = 'Riwayat'; sub = '3 hari'; }
    else { label = DAY_LABELS[t]; sub = fmtDate(t); }
    return `<button role="tab" aria-selected="${on}" data-tab="${t}"
      class="w-full flex items-center justify-between rounded-lg border px-3 py-2.5 text-sm font-semibold transition ${pill(on)}">
      ${label}<span class="text-[11px] font-medium ${subCls(on)}">${sub}</span></button>`;
  }).join('');
  const hd = $('#hdays');
  hd.classList.toggle('hidden', state.tab !== 'hist');
  hd.innerHTML = HIST_DAYS.map(o => `
    <button data-hday="${o}" aria-pressed="${state.hday === o}"
      class="rounded-lg border py-1.5 text-xs font-semibold transition ${pill(state.hday === o)}">${o === -1 ? 'Kemarin' : hDate(o)}</button>`).join('');
  $('#leagues').innerHTML = FILTERS.map(l => `
    <button data-league="${l}" aria-pressed="${state.league === l}"
      class="w-full text-left rounded-lg border px-3 py-2 text-sm font-semibold transition ${pill(state.league === l)}">${l}</button>`).join('');
  const tl = state.tab === 'live' ? 'Live' : state.tab === 'hist' ? 'Riwayat · ' + (state.hday === -1 ? 'Kemarin' : hDate(state.hday)) : DAY_LABELS[state.tab] + ' · ' + fmtDate(state.tab);
  $('#cur').textContent = tl + (state.league !== 'Semua Liga' ? ' · ' + state.league : '');
}

// Warna nama tim (mengikuti referensi): tim pemberi voor = biru, lawannya = merah.
// Voor 0 / tanpa voor: tuan rumah biru, tamu merah.
function logoHtml(src, name) {
  const ini = esc(String(name).split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase());
  if (!src) return `<span class="ini">${ini}</span>`;
  return `<img class="logo" src="${esc(src)}" alt="" loading="lazy" decoding="async"
    onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="ini" hidden>${ini}</span>`;
}

function teamRow(name, logo, blue, gives, val, score, win) {
  return `<div class="flex items-center gap-2 min-w-0">
    ${logoHtml(logo, name)}
    <span class="truncate text-[15px] font-bold ${blue ? 'text-nblue' : 'text-nred'}">${esc(name)}</span>
    ${gives && val !== 0 ? `<span class="shrink-0 rounded bg-lime px-1.5 py-0.5 text-[11px] font-extrabold text-card tnum">${fmtHdp(val, true)}</span>` : ''}
    ${score != null ? `<span class="ml-auto shrink-0 min-w-[1.6rem] rounded bg-ink/5 px-1.5 text-center text-base tnum ${win ? 'font-extrabold text-ink' : 'font-semibold text-lmute'}">${esc(score)}</span>` : ''}
  </div>`;
}

function cell(label, main, sub) {
  return `<div class="px-2 py-2 text-center">
    <div class="text-[10px] text-lmute">${label}</div>
    <div class="text-sm font-bold tnum">${main}</div>
    ${sub ? `<div class="truncate text-[10px] text-lmute">${sub}</div>` : ''}
  </div>`;
}

function matchHtml(m) {
  const hasH = m.hdp !== null && m.hdp !== undefined;
  const hg = m.side === 'h';
  const giver = hg ? m.home : m.away;
  const homeBlue = hasH && m.hdp !== 0 ? hg : true;
  const hdpCell = hasH ? cell('HDP', `<span class="text-ink">${fmtHdp(m.hdp, true)}</span>`, esc(giver)) : cell('HDP', '-', '');
  const ouCell = cell('O/U', m.ou ? esc(m.ou) : '-', '');
  const min = Math.min(...m.odds.filter(Boolean));
  const oddsCell = `<div class="px-2 py-2 text-center">
    <div class="grid grid-cols-3 text-[10px] text-lmute"><span>1</span><span>X</span><span>2</span></div>
    <div class="grid grid-cols-3 text-sm font-bold tnum">${m.odds.map(o => `<span class="${o && o === min ? 'text-nred' : 'text-oblue'}">${o ? o.toFixed(2) : '-'}</span>`).join('')}</div>
  </div>`;
  const sc = m.score && m.score[0] != null && m.score[0] !== '' ? m.score : null;
  const hs = sc ? +sc[0] : 0, as = sc ? +sc[1] : 0;
  return `<div class="match sm:flex sm:items-center border-t border-lline first:border-t-0" role="button" tabindex="0" data-id="${m.id}" aria-label="Salin pasaran ${esc(m.home)} vs ${esc(m.away)}">
    <div class="flex items-center gap-3 px-3 pt-3 sm:py-3 sm:flex-1 min-w-0">
      <div class="w-14 shrink-0 text-center space-y-0.5">
        ${state.tab === 'hist' || state.tab === 'live' ? `<div class="text-[10px] text-lmute">${new Date(m.ts).toLocaleDateString('id-ID', { timeZone: TZ, day: 'numeric', month: 'short' })}</div>` : ''}
        <div class="text-sm font-bold tnum">${fmtTime(m.ts)}</div>${statusHtml(m)}
      </div>
      <div class="min-w-0 flex-1 space-y-1">${teamRow(m.home, m.homeLogo, homeBlue, hasH && hg, m.hdp, sc && sc[0], sc && hs >= as)}${teamRow(m.away, m.awayLogo, !homeBlue, hasH && !hg, m.hdp, sc && sc[1], sc && as >= hs)}</div>
    </div>
    <div class="mt-2 sm:mt-0 grid grid-cols-[1fr_1fr_1.7fr] divide-x divide-lline border-t border-lline sm:border-t-0 sm:w-[300px] md:w-[340px] sm:shrink-0">
      ${hdpCell}${ouCell}${oddsCell}
    </div>
  </div>`;
}

function baseList() {
  if (state.tab === 'live') return state.all.filter(m => status(m).s === 'live');
  if (state.tab === 'hist') return state.all.filter(m => dayOf(m.ts) === dateStr(state.hday) && status(m).s === 'ft');
  return state.all.filter(m => dayOf(m.ts) === dateStr(state.tab));
}

function visible() {
  const q = state.q.trim().toLowerCase();
  return baseList()
    .filter(m => state.league === 'Semua Liga' || m.group === state.league)
    .filter(m => !q || [m.home, m.away, m.league].some(t => t.toLowerCase().includes(q)))
    .sort((a, b) => state.tab === 'hist' ? b.ts - a.ts : a.ts - b.ts);
}

function renderList() {
  const b = $('#banner');
  if (state.error) {
    b.classList.add('hidden');
    $('#list').innerHTML = `<div class="rounded-xl border border-lline bg-lcard p-8 text-center text-sm">
      <p class="text-lmute">${esc(state.error)}</p>
      <p class="mt-1 text-xs text-lmute">Jika dijalankan lokal, gunakan <code>vercel dev</code>, bukan membuka file langsung.</p>
      <button data-retry class="mt-4 rounded-lg bg-lime px-4 py-2 font-semibold text-card">Coba lagi</button></div>`;
    return;
  }
  b.classList.toggle('hidden', !(state.demo || state.notice));
  b.textContent = state.notice || 'Mode demo: menampilkan data contoh.';

  const ms = visible();
  if (!ms.length && (state.tab === 'live' || state.tab === 'hist')) {
    $('#list').innerHTML = `<div class="rounded-xl border border-lline bg-lcard p-8 text-center text-sm text-lmute">${state.tab === 'live' ? 'Belum ada pertandingan yang sedang berlangsung.' : 'Tidak ada hasil pertandingan untuk tanggal ini.'}</div>`;
    return;
  }
  if (!ms.length) {
    const cur = dateStr(state.tab);
    const next = (state.all || []).find(m => m.ts > Date.now()
      && (state.league === 'Semua Liga' || m.group === state.league)
      && new Date(m.ts).toLocaleDateString('en-CA', { timeZone: TZ }) > cur);
    const hint = next ? `<p class="mt-2 text-xs">Pertandingan berikutnya: ${new Date(next.ts).toLocaleDateString('id-ID', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' })}</p>` : '';
    $('#list').innerHTML = `<div class="rounded-xl border border-lline bg-lcard p-8 text-center text-sm text-lmute">Tidak ada pertandingan. Ubah tanggal, liga, atau kata kunci pencarian.${hint}</div>`;
    return;
  }
  const groups = {};
  ms.forEach(m => (groups[m.league] = groups[m.league] || []).push(m));
  const order = Object.keys(groups).sort((x, y) => groups[x][0].order - groups[y][0].order);
  $('#list').innerHTML = order.map(l => `
    <section class="overflow-hidden rounded-xl border border-lline bg-lcard">
      <div class="flex items-center justify-between bg-lhead border-b-2 border-[#55cb47] px-3 py-2">
        <h2 class="text-sm font-bold">${esc(l)}<span class="ml-2 text-xs font-medium text-lmute">${esc(groups[l][0].country || '')}</span></h2>
        <span class="text-xs text-lmute">${groups[l].length} laga</span>
      </div>
      ${groups[l].map(matchHtml).join('')}
    </section>`).join('');
}

function renderUpd() {
  if (!state.updatedAt) return;
  const left = Math.max(0, REFRESH_MS - (Date.now() - state.updatedAt));
  const mm = Math.floor(left / 6e4), ss = String(Math.floor(left / 1e3) % 60).padStart(2, '0');
  $('#upd').textContent = `Update ${fmtTime(state.updatedAt)} WIB · berikutnya ${mm}:${ss}`;
}

function renderAll() { renderFilters(); renderList(); renderUpd(); }

async function refresh(force) {
  renderFilters();
  if (!state.all.length) $('#list').innerHTML = `<div class="rounded-xl border border-lline bg-lcard p-8 text-center text-sm text-lmute">Memuat pasaran…</div>`;
  await loadData(force);
  renderAll();
}

/* ================= COPY PASARAN ================= */
function marketText(m) {
  const hasH = m.hdp !== null && m.hdp !== undefined && m.hdp !== 0;
  const h = esc0(m.home) + (hasH && m.side === 'h' ? ` (-${m.hdp})` : '');
  const a = esc0(m.away) + (hasH && m.side === 'a' ? ` (-${m.hdp})` : '');
  return `${h} vs ${a} | O/U: ${m.ou || '-'}`;
}
const esc0 = s => String(s);

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('opacity-0', 'translate-y-4');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('opacity-0', 'translate-y-4'), 2200);
}

function copyMatch(id) {
  const m = state.all.find(x => x.id === id);
  if (!m) return;
  const t = marketText(m);
  copyText(t).then(() => toast('Tersalin: ' + t));
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const r = e.target.closest('[data-retry]'), d = e.target.closest('[data-tab]'), hd = e.target.closest('[data-hday]'), l = e.target.closest('[data-league]'), m = e.target.closest('[data-id]');
  if (r) { state.error = ''; refresh(true); }
  else if (d) { const t = d.dataset.tab; state.tab = isNaN(+t) ? t : +t; renderAll(); window.scrollTo({ top: 0 }); }
  else if (hd) { state.hday = +hd.dataset.hday; renderAll(); }
  else if (l) { state.league = l.dataset.league; renderFilters(); renderList(); }
  else if (m) copyMatch(m.dataset.id);
});
document.addEventListener('keydown', e => {
  const m = e.target.closest && e.target.closest('[data-id]');
  if (m && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); copyMatch(m.dataset.id); }
});
/* ===== SIDEBAR ===== */
function side(open) {
  $('#side').classList.toggle('open', open); $('#ovl').classList.toggle('open', open);
  document.body.classList.toggle('lock', open); $('#burger').setAttribute('aria-expanded', open);
}
$('#burger').addEventListener('click', () => side(true));
$('#curbtn').addEventListener('click', () => side(true));
$('#sclose').addEventListener('click', () => side(false));
$('#ovl').addEventListener('click', () => side(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') side(false); });
document.addEventListener('click', e => { if (e.target.closest('#side [data-tab]:not([data-tab="hist"]), #side [data-hday], #side [data-league]')) side(false); });
$('#reload').addEventListener('click', () => refresh(true));
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });

/* ================= JAM WIB ================= */
function tick() {
  $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false });
}
tick(); setInterval(() => { tick(); renderUpd(); }, 1000);
setInterval(() => refresh(true), REFRESH_MS);                     // auto-update data tiap 10 menit
document.addEventListener('visibilitychange', () => {             // tab dibuka lagi & data sudah lewat 10 menit
  if (!document.hidden && Date.now() - state.updatedAt >= REFRESH_MS) refresh(true);
});

refresh();
</script>
</body>
</html>
